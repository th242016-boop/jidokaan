[variables]
NITRO_PRESET = "node-server"
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"
PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
NITRO_MAX_REQUEST_SIZE = "83886080"


[phases.setup]
# Pin the stable Nixpkgs revision that supplies Node.js 22.23.5.
nixpkgsArchive = "3457b69ac4aba6d9ea9a743370af160fb502db29"
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["node --version", "test \"$(node -p process.versions.node)\" = \"22.23.5\"", "npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run db:migrate && npm start"
