name: Reassemble verified JIDOKAAN source
on:
  push:
    branches: [transfer/verified-source-20261117]
    paths: [.source-transfer/ready]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify original bytes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const files = fs.readdirSync('.source-transfer').filter(x => /^region-part-\d{3}$/.test(x)).sort();
          if (files.length !== 76) throw new Error('Unexpected part count: ' + files.length);
          const bytes = Buffer.concat(files.map(x => fs.readFileSync('.source-transfer/' + x)));
          if (bytes.length !== 4955808) throw new Error('Byte count mismatch');
          const sha = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
          if (sha !== '6870cfe0fdf3804c4b5fd127b5f86a4c828ad467') throw new Error('Blob hash mismatch');
          fs.mkdirSync('src/lib/region-data', {recursive: true});
          fs.writeFileSync('src/lib/region-data/region-country.json', bytes);
          console.log('Verified original blob', sha, bytes.length);
          NODE
      - name: Preserve verified source on transfer branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/region-data/region-country.json
          git commit -m 'Preserve verified final region dataset'
          git push origin HEAD:transfer/verified-source-20261117
